# Actian VectorAI DB in one container.
# Start:  docker compose up -d      Stop:  docker compose down
services:
  vectorai:
    image: actian/vectorai:latest
    container_name: vectorai
    ports:
      - "6574:6574"   # gRPC: what the Python SDK talks to
      - "6573:6573"   # REST API
      - "6575:6575"   # Local UI: open http://localhost:6575 in your browser
    volumes:
      - ./local_data:/var/lib/actian-vectorai   # your data survives restarts
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES   # required: you accept the Actian EULA
    restart: unless-stopped
